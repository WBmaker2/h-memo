name: Windows Tauri Build

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (예: v0.1.0)"
        required: true

jobs:
  windows-tauri:
    name: Build Windows Tauri Artifacts
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows Tauri CLI native binding
        shell: pwsh
        run: |
          $tauriCliVersion = node -p "require('./node_modules/@tauri-apps/cli/package.json').version"
          npm install --no-save --ignore-scripts "@tauri-apps/cli-win32-x64-msvc@$tauriCliVersion"

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          $tag = ""
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_RELEASE_TAG
          } elseif ($env:GITHUB_REF_VALUE -like "refs/tags/*") {
            $tag = $env:REF_NAME
          }

          if ($tag) {
            Write-Host "Using release tag: $tag"
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check version consistency
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG) {
            npm run check:versions -- --release-tag "$env:RELEASE_TAG"
          } else {
            npm run check:versions
          }

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Tauri Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop bundle
        run: npm run build -w apps/desktop

      - name: Check release Firebase env
        if: ${{ steps.release_tag.outputs.release_tag != '' }}
        run: npm run check:firebase-env -- --require-desktop-oauth
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID || '' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID || vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}

      - name: Validate Tauri updater signing configuration
        if: ${{ steps.release_tag.outputs.release_tag != '' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Required Tauri updater setting is missing: TAURI_SIGNING_PRIVATE_KEY"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "Required Tauri updater setting is missing: TAURI_UPDATER_PUBLIC_KEY"
          }
          Write-Host "Tauri updater signing configuration is present. Key values are not displayed."

      - name: Build signed Tauri updater artifacts for release
        if: ${{ steps.release_tag.outputs.release_tag != '' }}
        run: npm run tauri:build:windows -w apps/desktop -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID || '' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID || vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}

      - name: Build unsigned Windows installer for non-release validation
        if: ${{ steps.release_tag.outputs.release_tag == '' }}
        run: npm run tauri:build:windows -w apps/desktop
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || vars.VITE_FIREBASE_MEASUREMENT_ID || '' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID || vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: h-memo-windows-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*
          if-no-files-found: error

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: h-memo-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: windows-tauri
    if: ${{ needs.windows-tauri.result == 'success' && needs.windows-tauri.outputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Confirm release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.windows-tauri.outputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "Release tag was not provided by the validated build job." >&2
            exit 1
          fi

          echo "Using validated release tag: $RELEASE_TAG"

      - name: Download MSI artifact
        uses: actions/download-artifact@v8
        with:
          name: h-memo-windows-msi
          path: release-assets/msi

      - name: Download NSIS artifact
        uses: actions/download-artifact@v8
        with:
          name: h-memo-windows-nsis
          path: release-assets/nsis

      - name: Create Tauri updater manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.windows-tauri.outputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/create-updater-manifest.mjs \
            --version "${RELEASE_TAG#v}" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --asset-dir release-assets/msi \
            --output latest.json

      - name: Upload installers and updater manifest to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows-tauri.outputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          mapfile -t msi_files < <(find release-assets/msi -type f -name "*.msi" | sort)
          mapfile -t msi_signatures < <(find release-assets/msi -type f -name "*.msi.sig" | sort)
          mapfile -t nsis_files < <(find release-assets/nsis -type f -name "*.exe" | sort)
          mapfile -t nsis_signatures < <(find release-assets/nsis -type f -name "*.exe.sig" | sort)

          if [ "${#msi_files[@]}" -ne 1 ] || [ "${#msi_signatures[@]}" -ne 1 ]; then
            echo "Expected exactly one MSI and one MSI signature." >&2
            exit 1
          fi
          if [ "${#nsis_files[@]}" -ne 1 ] || [ "${#nsis_signatures[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS installer and one NSIS signature." >&2
            exit 1
          fi
          if [ ! -s latest.json ]; then
            echo "latest.json was not generated." >&2
            exit 1
          fi

          artifacts=("${msi_files[@]}" "${msi_signatures[@]}" "${nsis_files[@]}" "${nsis_signatures[@]}" latest.json)
          echo "Found one MSI, one MSI signature, one NSIS installer, and one NSIS signature."

          existing_tag_commit=""
          if tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha' 2>/dev/null)"; then
            existing_tag_commit="$tag_commit"
          fi
          if [ -n "$existing_tag_commit" ] && [ "$existing_tag_commit" != "$RELEASE_TARGET" ]; then
            echo "Release tag $RELEASE_TAG resolves to $existing_tag_commit, but this workflow built $RELEASE_TARGET." >&2
            echo "Run the workflow from the matching tag/ref or use a new release tag." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading installers and latest.json..."
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating new release $RELEASE_TAG at $RELEASE_TARGET..."
            gh release create "$RELEASE_TAG" "${artifacts[@]}" --repo "$GITHUB_REPOSITORY" --title "H Memo $RELEASE_TAG" --generate-notes --target "$RELEASE_TARGET"
          fi
